<nav class="main-nav" id="main-nav" aria-label="主导航">{% for n in site.data.navigation %}
<div class="nav-item{% if n.children %} has-sub{% endif %}"><a href="{{ site.data.site.domain }}{{ n.href }}" class="nav-main">{{ n.label }}</a>{% if n.children %}<button type="button" class="nav-drop-toggle" aria-label="展开{{ n.label }}子分类" aria-expanded="false" aria-controls="drop-{{ n.slug }}">⌄</button><div class="dropdown" id="drop-{{ n.slug }}"><a href="{{ site.data.site.domain }}{{ n.href }}">全部{{ n.label }}</a>{% for c in n.children %}<a href="{{ site.data.site.domain }}{{ c.href }}">{{ c.label }}</a>{% endfor %}</div>{% endif %}</div>{% endfor %}</nav>
