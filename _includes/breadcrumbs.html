{% if page.breadcrumbs and page.breadcrumbs.size > 0 %}<nav class="breadcrumbs" aria-label="面包屑"><a href="{{ site.data.site.domain }}/">首页</a>{% for c in page.breadcrumbs %}<span aria-hidden="true">›</span>{% if c.href %}<a href="{{ site.data.site.domain }}{{ c.href }}">{{ c.label }}</a>{% else %}<span aria-current="page">{{ c.label }}</span>{% endif %}{% endfor %}</nav>{% endif %}
