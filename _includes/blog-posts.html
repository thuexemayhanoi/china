{% if site.posts.size == 0 %}<div class="empty-state"><div class="empty-icon">✦</div><h2>文章即将更新</h2><p class="muted">目前已发布文章：<strong>0 篇</strong>。这里不会展示虚构文章或无内容的链接。</p></div>{% else %}<div class="section-head"><h2>最新文章（{{ site.posts.size }} 篇）</h2></div><div class="cards">{% for p in site.posts %}<a class="card" href="{{ site.data.site.domain }}{{ p.url }}"><span class="card-id">{{ p.topic | default: '指南' }}</span><h3>{{ p.title | escape }}</h3><p>{{ p.description | escape }}</p><span class="card-link">阅读全文 →</span></a>{% endfor %}</div>{% endif %}
