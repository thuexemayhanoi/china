{% assign current_url = site.data.site.domain | append: page.url %}
<script type="application/ld+json">{"@context":"https://schema.org","@graph":[
{"@type":"WebSite","@id":{{ site.data.site.domain | append: "/#site" | jsonify }},"url":{{ site.data.site.domain | append: "/" | jsonify }},"name":{{ site.data.site.title | jsonify }},"inLanguage":"zh-CN"},
{"@type":"LocalBusiness","@id":{{ site.data.site.domain | append: "/#business" | jsonify }},"name":{{ site.data.site.business.name | jsonify }},"url":{{ site.data.site.domain | append: "/" | jsonify }},"telephone":{{ site.data.site.business.phone_e164 | jsonify }},"address":{"@type":"PostalAddress","streetAddress":{{ site.data.site.business.street | jsonify }},"addressLocality":{{ site.data.site.business.locality | jsonify }},"addressCountry":"VN"},"openingHoursSpecification":{"@type":"OpeningHoursSpecification","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],"opens":{{ site.data.site.business.opens | jsonify }},"closes":{{ site.data.site.business.closes | jsonify }}},"sameAs":[{{ site.data.site.business.maps | jsonify }}]},
{"@type":"{% if page.layout == 'blog' %}CollectionPage{% else %}WebPage{% endif %}","@id":{{ current_url | append: "#page" | jsonify }},"url":{{ current_url | jsonify }},"name":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"inLanguage":"zh-CN","isPartOf":{"@id":{{ site.data.site.domain | append: "/#site" | jsonify }}}}
{% if page.breadcrumbs and page.breadcrumbs.size > 0 %},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"首页","item":{{ site.data.site.domain | append: "/" | jsonify }}}{% for c in page.breadcrumbs %},{"@type":"ListItem","position":{{ forloop.index | plus: 1 }},"name":{{ c.label | jsonify }},"item":{% if c.href %}{{ site.data.site.domain | append: c.href | jsonify }}{% else %}{{ current_url | jsonify }}{% endif %}}{% endfor %}]}{% endif %}
{% if page.schema_faq %},{"@type":"FAQPage","mainEntity":[{% for f in site.data.faqs %}{"@type":"Question","name":{{ f.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ f.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}{% endif %}
{% if page.layout == 'post' %},{"@type":"BlogPosting","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"mainEntityOfPage":{{ current_url | jsonify }},"datePublished":{{ page.date | date_to_xmlschema | jsonify }},"dateModified":{{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},"author":{"@type":"Organization","name":{{ site.data.site.business.name | jsonify }}},"publisher":{"@type":"Organization","name":{{ site.data.site.business.name | jsonify }}},"inLanguage":"zh-CN"}{% endif %}
]}</script>
