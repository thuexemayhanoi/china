<section class="calculator" aria-labelledby="calc-title"><span class="eyebrow">INSTANT ESTIMATE</span><h2 id="calc-title">租车费用计算器</h2><p class="muted small">选择车型与租期，自动计算公开参考租金，不包含押金。</p><div class="field"><label for="vehicle">车型</label><select id="vehicle">{% for v in site.data.vehicles %}<option value="{{ forloop.index0 }}">{{ v.name }}</option>{% endfor %}</select></div><div class="form-grid"><div class="field"><label for="period">租赁单位</label><select id="period"><option value="day">天</option><option value="week">周</option><option value="month">月</option></select></div><div class="field"><label for="quantity">数量</label><input id="quantity" type="number" inputmode="numeric" min="1" max="365" value="1"></div></div><div class="estimate" aria-live="polite"><div class="small muted">预计租金（越南盾）</div><strong id="estimate-amount">150,000 ₫</strong><div class="deposit muted" id="estimate-deposit">参考押金（另计）：2–3 百万 ₫</div></div><p class="notice">计算结果仅为报价参考，不保证库存或最终价格。50cc 周/月租及电动车请单独咨询。</p><a class="btn btn-primary" style="width:100%;margin-top:14px" href="{{ site.data.site.business.zalo }}" target="_blank" rel="noopener noreferrer">通过 Zalo 确认报价 ↗</a><script type="application/json" id="pricing-data">{{ site.data.vehicles | jsonify }}</script></section>
