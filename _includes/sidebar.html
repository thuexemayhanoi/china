<aside class="sidebar" aria-label="分类导航"><details class="side-details"><summary>浏览全部分类</summary><div class="side-content">{% for n in site.data.navigation %}{% if n.slug %}<div class="side-group"><a href="{{ site.data.site.domain }}{{ n.href }}" class="side-title">{{ n.label }}</a>{% for c in n.children %}<a href="{{ site.data.site.domain }}{{ c.href }}">{{ c.label }}</a>{% endfor %}</div>{% endif %}{% endfor %}</div></details></aside>
