{% assign publisher = site.data.site.publisher %}{% if publisher and site.data.site.business.name %}<aside class="post-publisher section" aria-label="发布方"><div class="post-publisher-card"><img class="post-publisher-logo" src="{{ publisher.logo | default: '/assets/favicon.svg' }}" width="64" height="64" alt="{{ site.data.site.business.name | escape }} 标志" loading="lazy"><div class="post-publisher-content"><span class="post-publisher-label">发布方</span><h2>{{ site.data.site.business.name | escape }}</h2><p>{{ publisher.description | escape }}</p><div class="post-publisher-actions"><a href="{{ site.data.site.domain }}/contact/">联系门店 →</a><a href="tel:{{ site.data.site.business.phone_e164 }}">{{ site.data.site.business.phone_display }}</a></div></div></div></aside>{% endif %}
