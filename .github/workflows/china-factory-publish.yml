name: CHINA Publish Reviewed Posts

# Manual approval gate. This workflow NEVER creates articles.
# It publishes only 1..5 existing, reviewed _drafts/CN-xxxx.md posts.
# Keep the native GitHub Pages/Jekyll branch deploy unchanged.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '1–5 reviewed IDs, comma separated (CN-0001,CN-0002)'
        type: string
        required: true
      confirm:
        description: 'Type PUBLISH after checking the draft and sources'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: china-factory-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production truth
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse stale source tree (never force push)
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main moved: rerun on latest branch after checking changes'
            exit 1
          }
      - name: Validate current website and matrix
        run: |
          python3 scripts/qa.py
          python3 scripts/china_factory.py validate
      - name: Scoped QA for only requested article IDs
        env:
          IDS: ${{ inputs.ids }}
        run: python3 scripts/china_factory.py qa --ids "$IDS"
      - name: Publish vetted drafts and update matrix atomically in Git
        env:
          IDS: ${{ inputs.ids }}
          CONFIRM: ${{ inputs.confirm }}
        run: python3 scripts/china_factory.py publish --ids "$IDS" --confirm "$CONFIRM"
      - name: Validate 250-row invariants after promotion
        run: |
          python3 scripts/china_factory.py validate --drafts
          python3 scripts/qa.py
      - name: Fast-forward commit (no force, no rebase of other writers)
        env:
          IDS: ${{ inputs.ids }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/china-matrix.csv _drafts _posts
          if git diff --cached --quiet; then
            echo "No reviewed article changes; refusing empty publication"
            exit 1
          fi
          git commit -m "china: publish approved posts $IDS"
          git push origin HEAD:main
      - name: Progress summary
        run: python3 scripts/china_factory.py status
