name: CHINA Scoped Article QA

# Manual dry-run QA only. External writer promotes and pushes with its own
# authenticated GitHub credentials so native GitHub Pages deploys.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '1-5 staged IDs to validate, separated by comma'
        type: string
        required: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate matrix and site
        run: |
          python3 scripts/qa.py
          python3 scripts/china_factory.py validate
      - name: QA requested draft IDs
        env:
          IDS: ${{ inputs.ids }}
        run: python3 scripts/china_factory.py qa --ids "$IDS"
      - name: No filesystem writes
        run: test -z "$(git status --porcelain --untracked-files=no)"
