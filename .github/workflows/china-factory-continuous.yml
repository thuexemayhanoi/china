name: CHINA Continuous Article Factory

# Read-only recovery and QA. External writer runs 'process' BEFORE its push.
# GitHub GITHUB_TOKEN pushes do NOT trigger native branch-based Pages builds.
on:
  push:
    branches: [main]
    paths:
      - '_drafts/**'
      - '_posts/**'
      - 'data/china-matrix.csv'
      - 'data/china-matrix-extra.csv'
      - 'data/china-writer-queue.json'
      - 'data/china-factory-state.json'
      - 'scripts/china_factory.py'
      - '.github/workflows/china-factory-continuous.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: china-factory-qa-watchdog
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python3 -m py_compile scripts/china_factory.py
      - name: Validate website and 300 Matrix rows
        run: |
          python3 scripts/qa.py
          python3 scripts/china_factory.py validate
          python3 scripts/china_factory.py status
      - name: Report pending drafts and next writer queue
        run: |
          python3 scripts/china_factory.py pending-count
          python3 scripts/china_factory.py queue
      - name: Confirm no repo writes in watchdog
        run: test -z "$(git status --porcelain --untracked-files=no)"
