name: CHINA AI Search FAQ Matrix Audit

on:
  push:
    branches: [audit/china-faq-ai-search-20261012]
    paths:
      - '.github/workflows/china-faq-ai-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-331:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate evidence-based Matrix for all 331 URLs
        run: python3 scripts/china_faq_ai_audit.py
      - name: Check current Matrix consistency (read only)
        run: python3 scripts/china_factory.py validate
      - name: Check core site source QA (read only)
        run: python3 scripts/qa.py
      - name: Persist audit reports only on isolated audit branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "audit/china-faq-ai-search-20261012"
          git add docs/AI-SEARCH-FAQ-URL-MATRIX.csv docs/AI-SEARCH-FAQ-QUESTION-EVIDENCE.csv docs/AI-SEARCH-FAQ-AUDIT.md
          if git diff --cached --quiet; then
            echo "Audit reports already up to date"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "audit(china): generate 331 URL FAQ AI Search evidence matrix"
            git push origin HEAD:audit/china-faq-ai-search-20261012
          fi

# Re-run after separating title-answer intent from explicit FAQs.

# Rerun duplicate-question/fact-risk audit revision.
